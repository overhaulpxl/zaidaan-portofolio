<script>
        // Simple JS for header background on scroll if needed later, though prompt asks for white space.
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('bg-surface', 'bg-opacity-90', 'backdrop-blur-sm');
                header.classList.remove('bg-transparent');
            } else {
                header.classList.remove('bg-surface', 'bg-opacity-90', 'backdrop-blur-sm');
                header.classList.add('bg-transparent');
            }
        });
